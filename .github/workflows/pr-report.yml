name: PR report

on:
  pull_request_target:
    types: [opened, ready_for_review, labeled]

# The script is checked out from the trusted BASE branch. PR code is never run.
permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  report:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'refresh-pr-report')
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check report generation
        run: python3 -B -m unittest discover -s .github/scripts/tests
      - name: Create or update PR report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_REPORT_MODEL: ${{ vars.PR_REPORT_MODEL }}
        run: python3 .github/scripts/pr_report.py
