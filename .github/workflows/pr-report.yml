name: PR report

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

# The script is checked out from the trusted BASE branch. PR code is never run.
permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Create or update PR report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/pr_report.py
